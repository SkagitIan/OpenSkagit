{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />
  <title>Kids Lab</title>
  <link rel="stylesheet" href="{% static 'kidslab/app.css' %}" />
</head>
<body class="bg-slate-950 text-white">
  <div id="app" class="fixed inset-0 overflow-hidden">
    <div
      id="swipe-layer"
      class="relative h-full w-full touch-none select-none"
      role="region"
      aria-label="Kids full screen experience"
    >
      <div
        id="card-stack"
        class="relative h-full w-full"
      ></div>
      <div class="kidslab-edge-buttons">
        <button class="edge-top" data-direction="up" type="button">Up</button>
        <button class="edge-bottom" data-direction="down" type="button">Down</button>
        <button class="edge-left" data-direction="left" type="button">Left</button>
        <button class="edge-right" data-direction="right" type="button">Right</button>
      </div>
      <div
        id="kidslab-empty-state"
        class="absolute inset-0 items-center justify-center px-6 text-center text-sm uppercase tracking-[0.4em] text-white/60"
        style="display:none;"
      >
        No cards yet — add playful experiences via the admin.
      </div>
    </div>
  </div>
  {{ cards|json_script:"kidslab-cards" }}
  <script defer src="{% static 'kidslab/app.js' %}"></script>
</body>
</html>
