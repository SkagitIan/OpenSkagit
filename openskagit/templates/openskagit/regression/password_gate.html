{% extends "openskagit/appeal_base_v3.html" %}

{% block extra_css %}
<script src="https://cdn.tailwindcss.com"></script>
{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  <div class="bg-white border border-[#dbe7dd] rounded-xl shadow-sm p-6 space-y-4">
    <div>
      <h1 class="text-xl font-semibold text-[#1f3327]">Regression Access</h1>
      <p class="text-sm text-gray-600 mt-1">Enter the password to open the regression control center.</p>
    </div>
    {% if error_message %}
      <div class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
        {{ error_message }}
      </div>
    {% endif %}
    <form method="post" class="space-y-3">
      {% csrf_token %}
      <label class="block text-sm font-medium text-[#1f3327]" for="gate_password">Password</label>
      <input
        id="gate_password"
        name="gate_password"
        type="password"
        required
        autofocus
        class="w-full rounded-lg border border-[#dbe7dd] px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#7fa489]"
      />
      <button
        type="submit"
        class="w-full rounded-lg bg-[#2a5b3b] px-4 py-2 text-sm font-semibold text-white hover:bg-[#234a31]"
      >
        Unlock
      </button>
    </form>
  </div>
</div>
{% endblock %}
