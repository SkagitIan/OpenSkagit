{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  {% include "openskagit/head.html" %}
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    .map-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #sedro-zoning-map {
      position: absolute;
      inset: 0;
    }

    .map-banner {
      position: absolute;
      top: 10px;
      left: 50%;
      z-index: 900;
      transform: translateX(-50%);
      width: min(760px, calc(100vw - 24px));
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(8px);
      padding: 0.65rem 1rem;
      text-align: center;
      box-shadow: 0 16px 40px rgba(2, 6, 23, 0.4);
    }

    .map-banner__topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
    }

    .map-banner__eyebrow {
      margin: 0;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #cbd5e1;
    }

    .map-banner h1 {
      margin: 0.2rem 0;
      font-size: clamp(1rem, 2vw, 1.35rem);
      font-weight: 700;
      color: #f8fafc;
    }

    .map-banner p {
      margin: 0;
      font-size: 0.82rem;
      color: #cbd5e1;
    }

    .map-banner__toggle {
      display: inline-flex;
      border: 1px solid rgba(148, 163, 184, 0.55);
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.7);
      color: #e2e8f0;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.22rem 0.58rem;
      cursor: pointer;
    }

    .map-banner.map-banner--collapsed {
      padding: 0.45rem 0.65rem;
    }

    .map-banner.map-banner--collapsed .map-banner__content {
      display: none;
    }

    .map-banner__content {
      margin-top: 0.25rem;
    }

    .map-banner__filters {
      margin-top: 0.55rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.55rem;
      flex-wrap: wrap;
    }

    .map-banner__filter-group {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: nowrap;
    }

    .map-banner__filter-label {
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #cbd5e1;
      font-weight: 600;
    }

    .map-banner__filter-select {
      min-width: 180px;
      max-width: 300px;
      border: 1px solid rgba(148, 163, 184, 0.55);
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.85);
      color: #f8fafc;
      font-size: 0.8rem;
      padding: 0.35rem 0.55rem;
    }

    .map-banner__filter-checkbox {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.74rem;
      letter-spacing: 0.04em;
      color: #cbd5e1;
      font-weight: 600;
      white-space: nowrap;
    }

    .map-banner__filter-checkbox input {
      width: 14px;
      height: 14px;
      accent-color: #ef4444;
    }

    .map-banner__help {
      margin-top: 0.45rem;
      font-size: 0.72rem;
      color: #bfdbfe;
      line-height: 1.35;
      text-align: center;
    }

    .leaflet-top {
      top: 86px;
    }

    .banner-collapsed .leaflet-top {
      top: 62px;
    }

    .leaflet-control-layers {
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 12px;
      background: rgba(248, 250, 252, 0.96);
      color: #0f172a;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.2);
      max-height: 55vh;
      overflow-y: auto;
    }

    .map-legend {
      min-width: 220px;
      max-width: 360px;
      max-height: 55vh;
      overflow-y: auto;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.92);
      color: #e2e8f0;
      padding: 0.75rem;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.32);
    }

    .map-legend__title {
      margin: 0 0 0.45rem;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f8fafc;
    }

    .map-legend__section {
      margin-top: 0.65rem;
      padding-top: 0.65rem;
      border-top: 1px solid rgba(148, 163, 184, 0.35);
    }

    .map-legend__subtitle {
      margin: 0 0 0.4rem;
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #cbd5e1;
      font-weight: 600;
    }

    .map-legend__rows {
      display: grid;
      gap: 0.35rem;
    }

    .map-legend__row {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: #e2e8f0;
      line-height: 1.3;
    }

    .map-legend__row > span:not(.map-legend__swatch) {
      flex: 1 1 auto;
      min-width: 0;
    }

    .map-legend__row > strong {
      margin-left: auto;
      flex: 0 0 auto;
      white-space: nowrap;
      color: #f8fafc;
    }

    .map-legend__row--zone {
      display: grid;
      grid-template-columns: 14px minmax(0, 1fr) auto;
      align-items: flex-start;
      padding: 0.2rem 0;
    }

    .map-legend__swatch {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: 1px solid rgba(226, 232, 240, 0.45);
      flex: 0 0 12px;
      margin-top: 0.15rem;
    }

    .map-legend__zone-meta {
      display: grid;
      gap: 0.15rem;
      min-width: 0;
    }

    .map-legend__zone-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.35rem;
      line-height: 1.2;
    }

    .map-legend__zone-code {
      font-size: 0.78rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .map-legend__zone-name {
      font-size: 0.72rem;
      color: #cbd5e1;
    }

    .map-legend__zone-description {
      margin: 0;
      font-size: 0.7rem;
      color: #cbd5e1;
      line-height: 1.35;
    }

    .map-legend__zone-reference {
      margin: 0;
      font-size: 0.68rem;
      color: #bfdbfe;
    }

    .map-legend__zone-reference a {
      color: #93c5fd;
      text-decoration: underline;
    }

    .map-legend__empty {
      margin: 0;
      font-size: 0.78rem;
      color: #cbd5e1;
    }

    .map-legend__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.45rem;
    }

    .map-legend__head .map-legend__title {
      margin: 0;
    }

    .map-legend__body {
      display: grid;
      gap: 0.65rem;
    }

    .map-legend__filters {
      display: grid;
      gap: 0.4rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.35);
      padding-bottom: 0.65rem;
    }

    .map-legend__filter-grid {
      display: grid;
      gap: 0.4rem;
    }

    .map-legend__filter-group {
      display: grid;
      gap: 0.24rem;
    }

    .map-legend__filter-label {
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #cbd5e1;
      font-weight: 600;
    }

    .map-legend__filter-select {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.55);
      border-radius: 9px;
      background: rgba(15, 23, 42, 0.85);
      color: #f8fafc;
      font-size: 0.78rem;
      padding: 0.32rem 0.5rem;
    }

    .map-legend__filter-checkbox {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.74rem;
      letter-spacing: 0.02em;
      color: #cbd5e1;
      font-weight: 600;
      white-space: nowrap;
    }

    .map-legend__filter-checkbox input {
      width: 14px;
      height: 14px;
      accent-color: #ef4444;
    }

    .map-legend__note {
      margin: 0;
      font-size: 0.68rem;
      color: #94a3b8;
      line-height: 1.35;
    }

    .map-legend__explain {
      margin: 0;
      font-size: 0.71rem;
      color: #cbd5e1;
      line-height: 1.35;
    }

    .map-legend__toggle {
      display: inline-flex;
      border: 1px solid rgba(148, 163, 184, 0.55);
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.7);
      color: #e2e8f0;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.22rem 0.58rem;
      cursor: pointer;
    }

    .map-legend.map-legend--collapsed .map-legend__body {
      display: none;
    }

    .leaflet-popup-content {
      margin: 0.7rem 0.8rem;
      color: #0f172a;
      min-width: 180px;
    }

    .map-popup__title {
      margin: 0 0 0.25rem;
      font-size: 0.92rem;
      font-weight: 700;
    }

    .map-popup__line {
      margin: 0;
      font-size: 0.82rem;
      color: #334155;
    }

    .map-popup__line--detail {
      margin-top: 0.28rem;
      font-size: 0.77rem;
      line-height: 1.32;
      color: #475569;
    }

    .ward-label {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.65);
      border-radius: 999px;
      color: #f8fafc;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 2px 7px;
      box-shadow: 0 4px 10px rgba(2, 6, 23, 0.3);
    }

    .ward-label::before {
      display: none;
    }

    .new-construction-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: 1px solid rgba(248, 250, 252, 0.95);
      margin-right: 0.45rem;
      vertical-align: middle;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.45);
    }

    .new-construction-dot--2024 {
      background: #ff9f0a;
    }

    .new-construction-dot--2025 {
      background: #ff2d55;
    }

    .new-construction-pulse {
      animation: sw-construction-pulse 1.8s ease-in-out infinite;
      filter: drop-shadow(0 0 6px rgba(255, 45, 85, 0.85));
    }

    @keyframes sw-construction-pulse {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.3);
      }
    }

    @media (max-width: 720px) {
      .map-banner {
        left: 12px;
        right: 12px;
        width: auto;
        transform: none;
      }

      .map-banner__filter-group {
        width: 100%;
        justify-content: center;
      }

      .map-banner__filter-select {
        min-width: 150px;
      }

      .leaflet-top {
        top: 132px;
      }

      .map-legend {
        min-width: 170px;
        max-width: 88vw;
      }
    }
  </style>
</head>
<body>
  <main class="map-shell">
    <div id="sedro-zoning-map" role="region" aria-label="Sedro-Woolley parcel map"></div>
    <header id="map-banner" class="map-banner">
      <div class="map-banner__topline">
        <p class="map-banner__eyebrow">OpenSkagit Public Map</p>
        <button id="map-banner-toggle" class="map-banner__toggle" type="button" aria-expanded="true">Collapse</button>
      </div>
      <div id="map-banner-content" class="map-banner__content">
        <h1>Sedro-Woolley Parcel Map</h1>
        <p id="sw-map-status">Loading parcel map data...</p>
        <div class="map-banner__filters">
          <div class="map-banner__filter-group">
            <label class="map-banner__filter-label" for="zoning-zone-filter">Zone filter</label>
            <select id="zoning-zone-filter" class="map-banner__filter-select">
              <option value="__all__">All zoning classes</option>
            </select>
          </div>
        </div>
      </div>
    </header>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (function () {
      const dataEndpoint = "{{ zoning_data_endpoint }}";
      const mapNode = document.getElementById("sedro-zoning-map");
      const mapBannerNode = document.getElementById("map-banner");
      const mapBannerToggleNode = document.getElementById("map-banner-toggle");
      const statusNode = document.getElementById("sw-map-status");
      const zoneFilterNode = document.getElementById("zoning-zone-filter");
      let landLiftZoneFilterNode = null;
      let landLiftMinGapFilterNode = null;
      let landLiftTopDecileFilterNode = null;
      let landLiftControlsBound = false;
      if (!mapNode || typeof L === "undefined") {
        return;
      }

      const defaultView = { lat: 48.5035, lng: -122.2365, zoom: 13 };
      const colorPalette = [
        "#0ea5e9",
        "#22c55e",
        "#f97316",
        "#8b5cf6",
        "#ef4444",
        "#facc15",
        "#14b8a6",
        "#ec4899",
        "#06b6d4",
        "#84cc16",
      ];
      const zoneColors = Object.create(null);
      const zoneDetailsByCode = Object.create(null);
      let zoningLegendItems = [];
      let allZoningFeatures = [];
      let zoningLayer = null;
      let cityWardLayer = null;
      let allLandLiftFeatures = [];
      let landLiftLayer = null;
      let landLiftTargetZones = [];
      let constructionSummary = { total: 0, "2024": 0, "2025": 0 };
      let constructionMinYear = 2024;
      let landLiftSummary = { total_candidates: 0, top_decile_count: 0, max_lift_value: 0 };
      let landLiftBins = [];
      let landLiftMethodology = {};
      let mapHasBounds = false;
      const isMobile = window.matchMedia("(max-width: 720px)").matches;
      let bannerCollapsed = true;
      let legendCollapsed = true;

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function setStatus(message) {
        if (statusNode) {
          statusNode.textContent = message;
        }
      }

      function setBannerCollapsed(nextCollapsed) {
        bannerCollapsed = Boolean(nextCollapsed);
        if (mapBannerNode) {
          mapBannerNode.classList.toggle("map-banner--collapsed", bannerCollapsed);
        }
        document.body.classList.toggle("banner-collapsed", bannerCollapsed);
        document.body.classList.toggle("mobile-banner-collapsed", isMobile && bannerCollapsed);
        if (mapBannerToggleNode) {
          mapBannerToggleNode.textContent = bannerCollapsed ? "Expand" : "Collapse";
          mapBannerToggleNode.setAttribute("aria-expanded", bannerCollapsed ? "false" : "true");
        }
      }

      function assignZoneColors(legendItems) {
        legendItems.forEach(function (entry, index) {
          const zoneCode = entry && entry.zone_code ? String(entry.zone_code) : "Unknown";
          if (!zoneColors[zoneCode]) {
            zoneColors[zoneCode] = colorPalette[index % colorPalette.length];
          }
        });
        if (!zoneColors.Unknown) {
          zoneColors.Unknown = "#64748b";
        }
      }

      function zoneDisplayLabel(zoneCode, zoneName) {
        const code = String(zoneCode || "Unknown");
        const name = zoneName ? String(zoneName) : "";
        if (!name || name === code) {
          return code;
        }
        return code + " - " + name;
      }

      function indexZoneDetails(legendItems) {
        Object.keys(zoneDetailsByCode).forEach(function (code) {
          delete zoneDetailsByCode[code];
        });
        legendItems.forEach(function (entry) {
          const zoneCode = entry && entry.zone_code ? String(entry.zone_code) : "Unknown";
          zoneDetailsByCode[zoneCode] = entry || {};
        });
      }

      function selectedZoneCode() {
        if (!zoneFilterNode || !zoneFilterNode.value) {
          return "__all__";
        }
        return zoneFilterNode.value;
      }

      function filteredZoningFeatures() {
        const selected = selectedZoneCode();
        if (selected === "__all__") {
          return allZoningFeatures;
        }
        return allZoningFeatures.filter(function (feature) {
          const props = feature && feature.properties ? feature.properties : {};
          const zoneCode = String(props.zone_code || "Unknown");
          return zoneCode === selected;
        });
      }

      function updateStatus() {
        const selected = selectedZoneCode();
        const visibleCount = filteredZoningFeatures().length;
        const totalCount = allZoningFeatures.length;
        const zoneText =
          selected === "__all__"
            ? formatCount(totalCount) +
              " zoning parcels across " +
              formatCount(zoningLegendItems.length) +
              " designations"
            : formatCount(visibleCount) +
              " parcels in " +
              zoneDisplayLabel(
                selected,
                zoneDetailsByCode[selected] && zoneDetailsByCode[selected].zone_name
              );
        const constructionTotal = Number(constructionSummary.total || 0);
        const landLiftTotal = Number(landLiftSummary.total_candidates || allLandLiftFeatures.length || 0);
        const landLiftVisible = filteredLandLiftFeatures().length;
        setStatus(
          zoneText +
            " · " +
            formatCount(constructionTotal) +
            " new homes since " +
            constructionMinYear +
            " · " +
            formatCount(landLiftVisible) +
            " of " +
            formatCount(landLiftTotal) +
            " land-lift candidates shown."
        );
      }

      function populateZoneFilter(legendItems) {
        if (!zoneFilterNode) {
          return;
        }
        const options = ['<option value="__all__">All zoning classes</option>'];
        legendItems.forEach(function (entry) {
          const zoneCode = entry && entry.zone_code ? String(entry.zone_code) : "Unknown";
          const zoneName = entry && entry.zone_name ? String(entry.zone_name) : "";
          options.push(
            '<option value="' +
              escapeHtml(zoneCode) +
              '">' +
              escapeHtml(zoneDisplayLabel(zoneCode, zoneName)) +
              "</option>"
          );
        });
        zoneFilterNode.innerHTML = options.join("");
      }

      function zoneColor(zoneCode) {
        const key = String(zoneCode || "Unknown");
        if (!zoneColors[key]) {
          zoneColors[key] = colorPalette[Object.keys(zoneColors).length % colorPalette.length];
        }
        return zoneColors[key];
      }

      function bindLandLiftControls() {
        if (landLiftZoneFilterNode && landLiftMinGapFilterNode && landLiftTopDecileFilterNode) {
          return true;
        }
        landLiftZoneFilterNode = document.getElementById("land-lift-zone-filter");
        landLiftMinGapFilterNode = document.getElementById("land-lift-min-gap-filter");
        landLiftTopDecileFilterNode = document.getElementById("land-lift-top-decile-filter");
        if (!landLiftZoneFilterNode || !landLiftMinGapFilterNode || !landLiftTopDecileFilterNode) {
          return false;
        }
        if (!landLiftControlsBound) {
          landLiftZoneFilterNode.addEventListener("change", applyLandLiftFilter);
          landLiftMinGapFilterNode.addEventListener("change", applyLandLiftFilter);
          landLiftTopDecileFilterNode.addEventListener("change", applyLandLiftFilter);
          landLiftControlsBound = true;
        }
        return true;
      }

      function selectedLandLiftZoneCode() {
        if (!landLiftZoneFilterNode || !landLiftZoneFilterNode.value) {
          return "__all__";
        }
        return landLiftZoneFilterNode.value;
      }

      function selectedLandLiftMinGap() {
        const raw = landLiftMinGapFilterNode ? Number(landLiftMinGapFilterNode.value || 0) : 0;
        return Number.isFinite(raw) && raw > 0 ? raw : 0;
      }

      function landLiftTopDecileOnly() {
        return Boolean(landLiftTopDecileFilterNode && landLiftTopDecileFilterNode.checked);
      }

      function populateLandLiftZoneFilter(targetZones) {
        bindLandLiftControls();
        if (!landLiftZoneFilterNode) {
          return;
        }
        const zones = Array.isArray(targetZones) ? targetZones : [];
        const options = ['<option value="__all__">All target zones</option>'];
        zones.forEach(function (zoneCode) {
          const code = String(zoneCode || "").trim();
          if (!code) {
            return;
          }
          const zoneName = zoneDetailsByCode[code] && zoneDetailsByCode[code].zone_name;
          options.push(
            '<option value="' +
              escapeHtml(code) +
              '">' +
              escapeHtml(zoneDisplayLabel(code, zoneName)) +
              "</option>"
          );
        });
        landLiftZoneFilterNode.innerHTML = options.join("");
      }

      function filteredLandLiftFeatures() {
        const selectedZone = selectedLandLiftZoneCode();
        const minGap = selectedLandLiftMinGap();
        const topDecileOnly = landLiftTopDecileOnly();
        return allLandLiftFeatures.filter(function (feature) {
          const props = feature && feature.properties ? feature.properties : {};
          const zoneCode = String(props.zone_code || "Unknown");
          const liftValue = Number(props.lift_value || 0);
          const liftScore = Number(props.lift_score || 0);
          if (selectedZone !== "__all__" && zoneCode !== selectedZone) {
            return false;
          }
          if (liftValue < minGap) {
            return false;
          }
          if (topDecileOnly && liftScore < 90) {
            return false;
          }
          return true;
        });
      }

      function formatCount(value) {
        const num = Number(value);
        if (!Number.isFinite(num)) {
          return "0";
        }
        return num.toLocaleString();
      }

      function formatCurrency(value) {
        const amount = Number(value);
        if (!Number.isFinite(amount)) {
          return "$0";
        }
        return amount.toLocaleString(undefined, {
          style: "currency",
          currency: "USD",
          maximumFractionDigits: 0,
        });
      }

      function formatPercent(value, digits) {
        const ratio = Number(value);
        if (!Number.isFinite(ratio)) {
          return "0%";
        }
        return (ratio * 100).toFixed(typeof digits === "number" ? digits : 1) + "%";
      }

      function formatFixed(value, digits) {
        const num = Number(value);
        if (!Number.isFinite(num)) {
          return "0";
        }
        return num.toFixed(typeof digits === "number" ? digits : 0);
      }

      function fallbackText(value, defaultValue) {
        const normalized = String(value || "").trim();
        return normalized || defaultValue;
      }

      function landLiftColor(score) {
        const normalized = Number(score || 0);
        if (normalized >= 80) {
          return "#7f1d1d";
        }
        if (normalized >= 60) {
          return "#b91c1c";
        }
        if (normalized >= 40) {
          return "#ea580c";
        }
        if (normalized >= 20) {
          return "#f59e0b";
        }

      const layerControl = L.control.layers(

      map.createPane("newConstructionPane");

      map.createPane("cityWardsPane");

      let legendNode = null;
      let legendContentNode = null;
      let legendToggleNode = null;
      const legendControl = L.control({ position: "topright" });
      legendControl.onAdd = function () {

          "</div>" +
          '<div class="map-legend__body">' +
          '<div class="map-legend__filters">' +
          '<p class="map-legend__subtitle">Land Lift Filters</p>' +

          '<div class="map-legend__filter-group">' +

          "</div>" +
          '<div class="map-legend__filter-group">' +

          '<option value="250000">$250k+</option>' +
          '<option value="500000">$500k+</option>' +
          '<option value="1000000">$1.0M+</option>' +

          "</div>" +
          "</div>" +
          '<label class="map-legend__filter-checkbox" for="land-lift-top-decile-filter">' +
          '<input id="land-lift-top-decile-filter" type="checkbox">' +

          "</label>" +
          '<p class="map-legend__note">These filters affect only the Land Lift overlay.</p>' +
          "</div>" +
          '<div class="map-legend__content"><p class="map-legend__empty">Loading legend...</p></div>' +
          "</div>";
        legendContentNode = container.querySelector(".map-legend__content");
        legendToggleNode = container.querySelector(".map-legend__toggle");
        bindLandLiftControls();
        if (legendToggleNode) {
          legendToggleNode.addEventListener("click", function () {

            legendToggleNode.textContent = legendCollapsed ? "Expand" : "Collapse";
            legendToggleNode.setAttribute("aria-expanded", legendCollapsed ? "false" : "true");

      };
      legendControl.addTo(map);

      function renderLegend(legendItems, newConstructionStats, liftStats, liftScoreBins, liftMethodology) {
        if (!legendContentNode) {
          return;
        }
        const normalizedLiftStats = liftStats && typeof liftStats === "object" ? liftStats : {};
        const normalizedLiftBins = Array.isArray(liftScoreBins) ? liftScoreBins : [];
        const normalizedLiftMethodology =
          liftMethodology && typeof liftMethodology === "object" ? liftMethodology : {};
        const topDecileCount = Number(normalizedLiftStats.top_decile_count || 0);
        const maxLiftValue = Number(normalizedLiftStats.max_lift_value || 0);
        const liftTotal = Number(normalizedLiftStats.total_candidates || 0);
        const scoreDefinition = normalizedLiftMethodology.score_definition
          ? String(normalizedLiftMethodology.score_definition)
          : "Lift score is a percentile-style rank among the R-15 and MC candidate parcels (0 to 100).";
        const scoreInterpretation = normalizedLiftMethodology.score_interpretation
          ? String(normalizedLiftMethodology.score_interpretation)
          : "";
        const scoreNotPrediction = normalizedLiftMethodology.not_a_prediction
          ? String(normalizedLiftMethodology.not_a_prediction)
          : "";
        const liftScoreExplanationHtml =
          '<div class="map-legend__section">' +
          '<p class="map-legend__subtitle">How To Read Lift Score</p>' +
          '<p class="map-legend__explain">' +
          escapeHtml(scoreDefinition) +
          "</p>" +
          (scoreInterpretation
            ? '<p class="map-legend__explain">' + escapeHtml(scoreInterpretation) + "</p>"
            : "") +
          (scoreNotPrediction
            ? '<p class="map-legend__explain">' + escapeHtml(scoreNotPrediction) + "</p>"
            : "") +
          "</div>";
        const liftRows = normalizedLiftBins.length
          ? normalizedLiftBins
              .map(function (bin) {
                const label = bin && bin.label ? String(bin.label) : "Unspecified";
                const color = bin && bin.color ? String(bin.color) : "#facc15";
                const parcelCount = Number((bin && bin.parcel_count) || 0);
                return (
                  '<div class="map-legend__row">' +
                  '<span class="map-legend__swatch" style="background:' +
                  escapeHtml(color) +
                  ';"></span>' +
                  "<span>" +
                  escapeHtml(label) +
                  "</span>" +
                  "<strong>" +
                  formatCount(parcelCount) +
                  "</strong>" +
                  "</div>"
                );
              })
              .join("")
          : '<p class="map-legend__empty">No land-lift parcels returned.</p>';

        if (!legendItems.length) {
          legendContentNode.innerHTML =
            '<p class="map-legend__empty">No zoning rows returned.</p>' +
            '<div class="map-legend__section">' +
            '<p class="map-legend__subtitle">New Construction</p>' +
            '<p class="map-legend__empty">' +
            formatCount((newConstructionStats && newConstructionStats.total) || 0) +
            " new homes since " +
            escapeHtml((newConstructionStats && newConstructionStats.min_year) || constructionMinYear) +
            "</p>" +
            "</div>" +
            '<div class="map-legend__section">' +
            '<p class="map-legend__subtitle">Land Lift (R-15 + MC)</p>' +
            '<p class="map-legend__empty">Top decile parcels: ' +
            formatCount(topDecileCount) +
            " · Max gap: " +
            escapeHtml(formatCurrency(maxLiftValue)) +
            "</p>" +
            '<div class="map-legend__rows">' +
            liftRows +
            "</div>" +
            liftScoreExplanationHtml;
          return;
        }

        const rows = legendItems
          .map(function (entry) {
            const zoneCode = entry && entry.zone_code ? String(entry.zone_code) : "Unknown";
            const zoneName = entry && entry.zone_name ? String(entry.zone_name) : "";
            const description = entry && entry.description ? String(entry.description) : "";
            const codeReference = entry && entry.code_reference ? String(entry.code_reference) : "";
            const codeUrl = entry && entry.code_url ? String(entry.code_url) : "";
            const referenceHtml = codeReference
              ? codeUrl
                ? '<a href="' +
                  escapeHtml(codeUrl) +
                  '" target="_blank" rel="noopener noreferrer">' +
                  escapeHtml(codeReference) +
                  "</a>"
                : escapeHtml(codeReference)
              : "";
            return (
              '<div class="map-legend__row map-legend__row--zone">' +
              '<span class="map-legend__swatch" style="background:' +
              zoneColor(zoneCode) +
              ';"></span>' +
              '<div class="map-legend__zone-meta">' +
              '<div class="map-legend__zone-header">' +
              '<span class="map-legend__zone-code">' +
              escapeHtml(zoneCode) +
              "</span>" +
              (zoneName && zoneName !== zoneCode
                ? '<span class="map-legend__zone-name">' + escapeHtml(zoneName) + "</span>"
                : "") +
              "</div>" +
              (description
                ? '<p class="map-legend__zone-description">' + escapeHtml(description) + "</p>"
                : "") +
              (referenceHtml ? '<p class="map-legend__zone-reference">' + referenceHtml + "</p>" : "") +
              "</div>" +
              "<strong>" +
              escapeHtml(formatCount(entry.parcel_count)) +
              "</strong>" +
              "</div>"
            );
          })
          .join("");

        const count2024 = Number((newConstructionStats && newConstructionStats["2024"]) || 0);
        const count2025 = Number((newConstructionStats && newConstructionStats["2025"]) || 0);
        const total = Number((newConstructionStats && newConstructionStats.total) || 0);
        const minYearLabel = (newConstructionStats && newConstructionStats.min_year) || constructionMinYear;

        legendContentNode.innerHTML =
          '<div class="map-legend__rows">' +
          rows +
          "</div>" +
          '<div class="map-legend__section">' +
          '<p class="map-legend__subtitle">New Homes Since ' +
          escapeHtml(minYearLabel) +
          "</p>" +
          '<div class="map-legend__rows">' +
          '<div class="map-legend__row"><span><span class="new-construction-dot new-construction-dot--2024"></span>2024 builds</span><strong>' +
          formatCount(count2024) +
          "</strong></div>" +
          '<div class="map-legend__row"><span><span class="new-construction-dot new-construction-dot--2025"></span>2025 builds</span><strong>' +
          formatCount(count2025) +
          "</strong></div>" +
          '<div class="map-legend__row"><span>Total</span><strong>' +
          formatCount(total) +
          "</strong></div>" +
          "</div></div>" +
          '<div class="map-legend__section">' +
          '<p class="map-legend__subtitle">Land Lift (R-15 + MC)</p>' +
          '<div class="map-legend__rows">' +
          '<div class="map-legend__row"><span>Total candidates</span><strong>' +
          formatCount(liftTotal) +
          "</strong></div>" +
          '<div class="map-legend__row"><span>Top decile parcels</span><strong>' +
          formatCount(topDecileCount) +
          "</strong></div>" +
          '<div class="map-legend__row"><span>Max value gap</span><strong>' +
          escapeHtml(formatCurrency(maxLiftValue)) +
          "</strong></div>" +
          "</div>" +
          '<div class="map-legend__rows">' +
          liftRows +
          "</div></div>" +
          liftScoreExplanationHtml;
      }

      function registerOverlay(label, layer, visible) {
        layerControl.addOverlay(layer, label);
        if (visible) {
          layer.addTo(map);
        }
      }

      function fitMapToLayer(layer) {
        if (!layer || !layer.getLayers || layer.getLayers().length === 0 || mapHasBounds) {
          return;
        }
        map.fitBounds(layer.getBounds(), { padding: [24, 24], maxZoom: 16 });
        mapHasBounds = true;
      }

      function applyZoningFilter() {
        if (!zoningLayer) {
          return;
        }
        const filteredFeatures = filteredZoningFeatures();
        zoningLayer.clearLayers();
        zoningLayer.addData(filteredFeatures);
        fitMapToLayer(zoningLayer);
        updateStatus();
      }

      function applyLandLiftFilter() {
        if (!landLiftLayer) {
          updateStatus();
          return;
        }
        const filteredFeatures = filteredLandLiftFeatures();
        landLiftLayer.clearLayers();
        landLiftLayer.addData(filteredFeatures);
        updateStatus();
      }

      function buildZoningPopupHtml(props, zoneLabel, zoneDescription) {
        const assessedValue = Number(props.assessed_value);
        const marketValue = Number(props.total_market_value);
        const taxableValue = Number(props.taxable_value);
        const buildingValue = Number(props.building_value);
        const landValue = Number(props.land_market_value);
        const acres = Number(props.acres);
        const improvementShare = Number(props.improvement_share);
        const builtYear = Number(props.year_built);
        const propertyType = fallbackText(props.property_type, "Unknown");
        const assessedLabel = Number.isFinite(assessedValue) ? formatCurrency(assessedValue) : "Unavailable";
        const marketLabel = Number.isFinite(marketValue) ? formatCurrency(marketValue) : "Unavailable";
        const taxableLabel = Number.isFinite(taxableValue) ? formatCurrency(taxableValue) : "Unavailable";
        const buildingLabel = Number.isFinite(buildingValue) ? formatCurrency(buildingValue) : "Unavailable";
        const landLabel = Number.isFinite(landValue) ? formatCurrency(landValue) : "Unavailable";
        const acresLabel = Number.isFinite(acres) ? formatFixed(acres, 3) : "Unknown";
        const yearBuiltLabel = Number.isFinite(builtYear) && builtYear > 0 ? String(Math.round(builtYear)) : "Unknown";
        const improvementShareLabel = Number.isFinite(improvementShare)
          ? formatPercent(improvementShare, 1)
          : "Unavailable";
        return (
          '<p class="map-popup__title">' +
          escapeHtml(props.parcel_number || "Parcel") +
          "</p>" +
          '<p class="map-popup__line">' +
          escapeHtml(props.address || "Address unavailable") +
          "</p>" +
          '<p class="map-popup__line"><strong>Zoning:</strong> ' +
          escapeHtml(zoneLabel) +
          "</p>" +
          '<p class="map-popup__line"><strong>Jurisdiction:</strong> ' +
          escapeHtml(props.zoning_jurisdiction || "Unknown") +
          "</p>" +
          '<p class="map-popup__line"><strong>Assessed value:</strong> ' +
          escapeHtml(assessedLabel) +
          "</p>" +
          '<p class="map-popup__line"><strong>Total market value:</strong> ' +
          escapeHtml(marketLabel) +
          "</p>" +
          '<p class="map-popup__line"><strong>Taxable value:</strong> ' +
          escapeHtml(taxableLabel) +
          "</p>" +
          '<p class="map-popup__line"><strong>Land value:</strong> ' +
          escapeHtml(landLabel) +
          "</p>" +
          '<p class="map-popup__line"><strong>Building value:</strong> ' +
          escapeHtml(buildingLabel) +
          "</p>" +
          '<p class="map-popup__line"><strong>Property type:</strong> ' +
          escapeHtml(propertyType) +
          ' · <strong>Year built:</strong> ' +
          escapeHtml(yearBuiltLabel) +
          "</p>" +
          '<p class="map-popup__line map-popup__line--detail"><strong>Acres:</strong> ' +
          escapeHtml(acresLabel) +
          " · <strong>Improvement share:</strong> " +
          escapeHtml(improvementShareLabel) +
          "</p>" +
          (zoneDescription
            ? '<p class="map-popup__line map-popup__line--detail">' + escapeHtml(zoneDescription) + "</p>"
            : "")
        );
      }

      function createZoningLayer(layerLabel) {
        zoningLayer = L.geoJSON([], {
          pane: "zoningPane",
          style: function (feature) {
            const properties = feature && feature.properties ? feature.properties : {};
            return {
              color: "#1e293b",
              weight: 0.45,
              fillColor: zoneColor(properties.zone_code),
              fillOpacity: 0.7,
            };
          },
          onEachFeature: function (feature, layer) {
            const props = feature && feature.properties ? feature.properties : {};
            const zoneCode = String(props.zone_code || "Unknown");
            const zoneDetails = zoneDetailsByCode[zoneCode] || {};
            const zoneName = zoneDetails.zone_name ? String(zoneDetails.zone_name) : "";
            const zoneDescription = zoneDetails.description ? String(zoneDetails.description) : "";
            const zoneLabel =
              zoneName && zoneName !== zoneCode ? zoneCode + " (" + zoneName + ")" : zoneCode;
            const popupHtml = buildZoningPopupHtml(props, zoneLabel, zoneDescription);
            layer.bindPopup(popupHtml);
          },
        });
        registerOverlay(layerLabel || "Parcel zoning", zoningLayer, true);
      }

      function createNewConstructionLayer(payload) {
        const features = payload && Array.isArray(payload.features) ? payload.features : [];
        const summary = payload && payload.summary && typeof payload.summary === "object" ? payload.summary : {};
        constructionMinYear = Number((payload && payload.min_year) || constructionMinYear);
        constructionSummary = {
          "2024": Number(summary["2024"] || 0),
          "2025": Number(summary["2025"] || 0),
          total: Number(summary.total || features.length || 0),
          min_year: constructionMinYear,
        };

        const newConstructionLayer = L.geoJSON(features, {
          pane: "newConstructionPane",
          pointToLayer: function (feature, latlng) {
            const props = feature && feature.properties ? feature.properties : {};
            const builtYear = Number(props.year_built || 0);
            const isRecent = builtYear >= 2025;
            return L.circleMarker(latlng, {
              radius: isRecent ? 9 : 7,
              color: "#f8fafc",
              weight: 1.4,
              fillColor: isRecent ? "#ff2d55" : "#ff9f0a",
              fillOpacity: 0.98,
              className: "new-construction-pulse",
            });
          },
          onEachFeature: function (feature, layer) {
            const props = feature && feature.properties ? feature.properties : {};
            const popupHtml =
              '<p class="map-popup__title">' +
              escapeHtml(props.parcel_number || "Parcel") +
              "</p>" +
              '<p class="map-popup__line">' +
              escapeHtml(props.address || "Address unavailable") +
              "</p>" +
              '<p class="map-popup__line"><strong>Year built:</strong> ' +
              escapeHtml(props.year_built || "Unknown") +
              "</p>" +
              '<p class="map-popup__line"><strong>Type:</strong> ' +
              escapeHtml(props.property_type || "Unknown") +
              "</p>";
            layer.bindPopup(popupHtml);
          },
        });

        registerOverlay((payload && payload.layer_label) || "New homes (last 24 months)", newConstructionLayer, true);
      }

      function createCityWardsLayer(payload) {
        const normalizedPayload = payload && typeof payload === "object" ? payload : {};
        const features = Array.isArray(normalizedPayload.features) ? normalizedPayload.features : [];
        cityWardLayer = L.geoJSON(features, {
          pane: "cityWardsPane",
          style: function () {
            return {
              color: "#111827",
              weight: 2.8,
              opacity: 0.95,
              fill: true,
              fillColor: "#f43f5e",
              fillOpacity: 0.08,
              dashArray: null,
            };
          },
          onEachFeature: function (feature, layer) {
            const props = feature && feature.properties ? feature.properties : {};
            const wardCode = String(props.ward_code || "").trim() || "Unknown";
            const website = props.website_url ? String(props.website_url) : "";
            const marketValue = Number(props.total_market_value || 0);
            const parcelCount = Number(props.parcel_count || 0);
            const turnoutYear = props.turnout_year ? Number(props.turnout_year) : null;
            const turnoutRate = props.turnout_rate !== null && props.turnout_rate !== undefined
              ? Number(props.turnout_rate)
              : null;
            const turnoutBallots = Number(props.turnout_ballots_cast || 0);
            const turnoutResidential = Number(props.turnout_residential_parcels || 0);
            const censusYear = props.census_year ? Number(props.census_year) : null;
            const populationEstimate = Number(props.population_estimate || 0);
            const popupHtml =
              '<p class="map-popup__title">City Ward ' +
              escapeHtml(wardCode) +
              "</p>" +
              '<p class="map-popup__line"><strong>Total market value:</strong> ' +
              escapeHtml(formatCurrency(marketValue)) +
              "</p>" +
              '<p class="map-popup__line"><strong>Parcels:</strong> ' +
              escapeHtml(formatCount(parcelCount)) +
              "</p>" +
              '<p class="map-popup__line"><strong>Voter turnout' +
              (turnoutYear ? " (" + escapeHtml(turnoutYear) + " est.)" : " (est.)") +

              escapeHtml(turnoutRate !== null && Number.isFinite(turnoutRate) ? formatPercent(turnoutRate, 1) : "Unavailable") +
              "</p>" +
              '<p class="map-popup__line map-popup__line--detail"><strong>Ballots (est.):</strong> ' +
              escapeHtml(formatCount(Math.round(turnoutBallots))) +
              " · <strong>Residential parcels (est.):</strong> " +
              escapeHtml(formatCount(Math.round(turnoutResidential))) +
              "</p>" +
              '<p class="map-popup__line"><strong>Population' +
              (censusYear ? " (" + escapeHtml(censusYear) + " est.)" : "") +
              ":</strong> " +
              escapeHtml(formatCount(Math.round(populationEstimate))) +
              "</p>" +
              (website

            layer.bindTooltip(wardCode, {
              permanent: true,
              direction: "center",
              className: "ward-label",
            });
            layer.bindPopup(popupHtml);
          },
        });
        registerOverlay(normalizedPayload.layer_label || "City wards", cityWardLayer, true);
      }

      function createLandLiftLayer(payload) {
        const normalizedPayload = payload && typeof payload === "object" ? payload : {};
        const features = Array.isArray(normalizedPayload.features) ? normalizedPayload.features : [];
        const summary =
          normalizedPayload.summary && typeof normalizedPayload.summary === "object" ? normalizedPayload.summary : {};
        const scoreBins = Array.isArray(normalizedPayload.score_bins) ? normalizedPayload.score_bins : [];
        const targetZones = Array.isArray(normalizedPayload.target_zones) ? normalizedPayload.target_zones : [];
        landLiftMethodology =
          normalizedPayload.methodology && typeof normalizedPayload.methodology === "object"
            ? normalizedPayload.methodology
            : {};
        landLiftSummary = {
          total_candidates: Number(summary.total_candidates || features.length || 0),
          top_decile_count: Number(summary.top_decile_count || 0),
          max_lift_value: Number(summary.max_lift_value || 0),
        };
        landLiftBins = scoreBins;
        allLandLiftFeatures = features;
        landLiftTargetZones = targetZones;
        populateLandLiftZoneFilter(landLiftTargetZones);

        landLiftLayer = L.geoJSON([], {
          pane: "landLiftPane",
          style: function (feature) {
            const props = feature && feature.properties ? feature.properties : {};
            const liftScore = Number(props.lift_score || 0);
            const isTopTier = liftScore >= 80;
            return {
              color: isTopTier ? "#7f1d1d" : "#991b1b",
              weight: isTopTier ? 1.6 : 1.0,
              fillColor: landLiftColor(liftScore),
              fillOpacity: isTopTier ? 0.6 : 0.45,
              dashArray: isTopTier ? null : "4 3",
            };
          },
          onEachFeature: function (feature, layer) {
            const props = feature && feature.properties ? feature.properties : {};
            const liftScore = Number(props.lift_score || 0);
            const scoreRank = Number.isFinite(liftScore) ? Math.max(0, Math.min(100, Math.round(liftScore))) : 0;
            const assessedValue = Number(props.assessed_value);
            const taxableValue = Number(props.taxable_value);
            const assessedLabel = Number.isFinite(assessedValue) ? formatCurrency(assessedValue) : "Unavailable";
            const taxableLabel = Number.isFinite(taxableValue) ? formatCurrency(taxableValue) : "Unavailable";
            const popupHtml =
              '<p class="map-popup__title">' +
              escapeHtml(props.parcel_number || "Parcel") +
              "</p>" +
              '<p class="map-popup__line">' +
              escapeHtml(props.address || "Address unavailable") +
              "</p>" +
              '<p class="map-popup__line"><strong>Zone:</strong> ' +
              escapeHtml(props.zone_code || "Unknown") +
              "</p>" +
              '<p class="map-popup__line"><strong>Assessed value:</strong> ' +
              escapeHtml(assessedLabel) +
              "</p>" +
              '<p class="map-popup__line"><strong>Taxable value:</strong> ' +
              escapeHtml(taxableLabel) +
              "</p>" +
              '<p class="map-popup__line"><strong>Current value:</strong> ' +
              escapeHtml(formatCurrency(props.current_value || 0)) +
              "</p>" +
              '<p class="map-popup__line"><strong>Potential value:</strong> ' +
              escapeHtml(formatCurrency(props.potential_value || 0)) +
              "</p>" +
              '<p class="map-popup__line"><strong>Land lift gap:</strong> ' +
              escapeHtml(formatCurrency(props.lift_value || 0)) +
              "</p>" +
              '<p class="map-popup__line"><strong>Lift score:</strong> ' +
              escapeHtml(Number(liftScore || 0).toFixed(1)) +
              " / 100" +
              "</p>" +
              '<p class="map-popup__line map-popup__line--detail">Score ' +
              escapeHtml(scoreRank) +
              " means this parcel ranks above about " +
              escapeHtml(scoreRank) +
              "% of candidate parcels by modeled lift gap.</p>" +
              '<p class="map-popup__line map-popup__line--detail"><strong>Lift ratio:</strong> ' +
              escapeHtml(formatPercent(props.lift_ratio || 0, 1)) +
              " · <strong>Lot acres:</strong> " +
              escapeHtml(Number(props.acres || 0).toFixed(3)) +
              "</p>";
            layer.bindPopup(popupHtml);
          },
        });

        registerOverlay(normalizedPayload.layer_label || "Land Lift (R-15 and MC)", landLiftLayer, true);
        applyLandLiftFilter();
      }

      async function loadMapLayers() {
        setStatus("Loading map layers...");
        try {
          const response = await fetch(dataEndpoint, { headers: { Accept: "application/json" } });
          if (!response.ok) {
            throw new Error("Request failed with status " + response.status);
          }
          const payload = await response.json();
          allZoningFeatures = Array.isArray(payload.features) ? payload.features : [];
          zoningLegendItems = Array.isArray(payload.legend) ? payload.legend : [];
          indexZoneDetails(zoningLegendItems);
          assignZoneColors(zoningLegendItems);
          populateZoneFilter(zoningLegendItems);
          createZoningLayer(payload.layer_label || "Parcel zoning");
          applyZoningFilter();

          const cityWardsPayload =
            payload && payload.city_wards && typeof payload.city_wards === "object" ? payload.city_wards : {};
          createCityWardsLayer(cityWardsPayload);

          const newConstructionPayload =
            payload && payload.new_construction && typeof payload.new_construction === "object"
              ? payload.new_construction
              : {};
          createNewConstructionLayer(newConstructionPayload);
          const landLiftPayload =
            payload && payload.land_lift && typeof payload.land_lift === "object" ? payload.land_lift : {};
          createLandLiftLayer(landLiftPayload);
          renderLegend(zoningLegendItems, constructionSummary, landLiftSummary, landLiftBins, landLiftMethodology);
          updateStatus();

          if (!mapHasBounds) {
            map.setView([defaultView.lat, defaultView.lng], defaultView.zoom);
          }
        } catch (error) {
          map.setView([defaultView.lat, defaultView.lng], defaultView.zoom);
          renderLegend([], { total: 0, "2024": 0, "2025": 0 }, { total_candidates: 0 }, [], {});
          setStatus("Map data unavailable right now. Please try again.");
          console.error("Sedro-Woolley parcel map failed to load", error);
        }
      }

      if (zoneFilterNode) {
        zoneFilterNode.addEventListener("change", applyZoningFilter);
      }
      if (mapBannerToggleNode) {
        mapBannerToggleNode.addEventListener("click", function () {
          setBannerCollapsed(!bannerCollapsed);
        });
      }

      setBannerCollapsed(bannerCollapsed);

      loadMapLayers();
    })();
  </script>
</body>
</html>
