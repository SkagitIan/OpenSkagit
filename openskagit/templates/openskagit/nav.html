<header class="sticky top-0 z-50 bg-white border-b border-gray-200 shadow-sm backdrop-blur supports-[backdrop-filter]:bg-white/80" role="banner">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between py-4">
      <a href="/" class="flex items-center space-x-3 group focus:outline-none focus-visible:ring-2 focus-visible:ring-sage-400 rounded-lg">
        <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center shadow-sm group-hover:shadow-lg transition-shadow overflow-hidden">
          <img src="https://res.cloudinary.com/dfz4bhlzs/image/upload/v1768253765/logoicon_c_crop_w_480_h_467_x_0_y_0-Picsart-BackgroundRemover_uklqfi.png" alt="OpenSkagit mark" class="h-full w-full object-contain">
        </div>
        <span class="sr-only">OpenSkagit.com</span>
      </a>
      <div class="flex items-center space-x-3">
        <nav class="hidden md:flex items-center space-x-6" aria-label="Primary">
          {% for link in nav_links %}
          <a href="{{ link.href }}" class="text-gray-700 hover:text-sage-600 transition-colors font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-sage-400 rounded" data-nav-link>{{ link.label }}</a>
          {% empty %}
          {% endfor %}
        </nav>
        <button type="button" class="md:hidden inline-flex items-center justify-center rounded-lg border border-gray-200 bg-white p-2 text-gray-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-sage-500" aria-expanded="false" aria-controls="mobile-nav" data-nav-toggle>
          <span class="sr-only">Toggle navigation</span>
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </div>
    <div class="md:hidden hidden border-t border-gray-200" id="mobile-nav" data-nav-menu>
      <nav class="py-3 flex flex-col space-y-2" aria-label="Mobile">
        {% for link in nav_links %}
        <a href="{{ link.href }}" class="px-2 py-2 rounded-lg text-gray-700 hover:bg-sage-50 hover:text-sage-700 font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-sage-400" data-nav-link>{{ link.label }}</a>
        {% empty %}
        {% endfor %}
      </nav>
    </div>
  </div>
</header>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const toggle = document.querySelector('[data-nav-toggle]');
    const menu = document.querySelector('[data-nav-menu]');
    if (!toggle || !menu) {
      return;
    }
    toggle.addEventListener('click', function () {
      const expanded = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', expanded ? 'false' : 'true');
      menu.classList.toggle('hidden');
    });
    menu.querySelectorAll('[data-nav-link]').forEach(function (link) {
      link.addEventListener('click', function () {
        menu.classList.add('hidden');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
  });
</script>
